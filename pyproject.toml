[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phylomarker-prioritizer"
version = "0.5.0"
description = "Evolution-aware phylogenomic marker panel selection from BUSCO outputs, with independent phylogenetic validation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PhyloMarker contributors"}
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "dendropy>=4.6"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4"
]

[project.scripts]
phylomarker-select = "phylomarker_select.cli:main"
phylomarker-phylogeny = "phylomarker_phylogeny.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
